<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b35"><meta name="description" content="Browse my Pokémon card collection."><title>My Pokémon Card Collection</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f4f7ff;background:#0c1428}*{box-sizing:border-box}body{margin:0}header{padding:45px 22px 30px;background:radial-gradient(circle at 80% 0,#304a87,transparent 55%),linear-gradient(140deg,#172c55,#10182f);border-bottom:1px solid #344364}.wrap{max-width:1200px;margin:auto}h1{font-size:clamp(30px,5vw,53px);line-height:1.1;margin:8px 0 12px}.eyebrow{font-weight:750;color:#facc60;letter-spacing:.13em;font-size:12px}p{color:#b8c5e0}.stat{display:inline-block;border:1px solid #52648a;border-radius:100px;padding:9px 15px;margin-top:12px;color:#fff;font-weight:700}main{padding:25px 22px 70px}.filters{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:12px;margin-bottom:15px}input,select{width:100%;background:#192641;border:1px solid #435473;color:white;padding:13px;border-radius:11px;font:inherit}input::placeholder{color:#9babc9}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 20px;color:#b8c5e0;font-size:14px}.toolbar button{background:transparent;border:1px solid #435473;border-radius:8px;color:#f4f7ff;padding:8px 12px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}.card{background:#17243e;border:1px solid #2e3e60;border-radius:15px;overflow:hidden;min-width:0}.photo{aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#25395e,#101a31);overflow:hidden}.photo img{width:100%;height:100%;object-fit:contain}.placeholder{display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;gap:10px;color:#b7c7e7}.placeholder .symbol{font-size:48px}.details{padding:13px}.name{font-weight:800;font-size:15px;line-height:1.35;overflow-wrap:anywhere}.set{color:#a9badb;font-size:12px;margin:6px 0 11px}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{border-radius:100px;background:#2a3a5c;padding:5px 8px;color:#e4eafa;font-size:11px}.chip.gold{background:#5d4620;color:#ffdb8b}.empty{text-align:center;padding:50px;color:#aabbd7}footer{text-align:center;color:#8c9fbe;padding:25px;font-size:12px;border-top:1px solid #283752}[hidden]{display:none!important}.more{display:block;margin:30px auto;background:#f8cb57;border:0;border-radius:10px;padding:13px 25px;color:#15213a;font-weight:800;cursor:pointer}@media(max-width:750px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.details{padding:10px}.photo{aspect-ratio:4/5}}@media(max-width:370px){.filters{grid-template-columns:1fr}.filters input{grid-column:auto}}
</style></head><body><header><div class="wrap"><div class="eyebrow">THE COLLECTION</div><h1>My Pokémon<br>Card Collection</h1><p>Explore the cards, sets, rarities, and special variants in my collection.</p><div class="stat" id="total">Loading collection…</div></div></header><main class="wrap"><div class="filters"><input id="search" type="search" placeholder="Search cards, sets, numbers…" aria-label="Search cards"><select id="set" aria-label="Filter by set"><option value="">All sets</option></select><select id="rarity" aria-label="Filter by rarity"><option value="">All rarities</option></select><select id="condition" aria-label="Filter by condition"><option value="">All conditions</option></select></div><div class="toolbar"><span id="count" role="status" aria-live="polite">Loading…</span><button id="reset">Clear filters</button></div><div id="grid" class="grid"></div><button id="more" class="more" hidden>Show more cards</button></main><footer>Pokémon card collection • For viewing only • Card images belong to their respective owners</footer><script>
let cards=[],filtered=[],shown=0;const $=id=>document.getElementById(id);const perPage=60;
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fill(id,key){let vals=[...new Set(cards.map(c=>c[key]).filter(Boolean))].sort((a,b)=>a.localeCompare(b));for(const v of vals){let o=document.createElement('option');o.value=v;o.textContent=v;$(id).appendChild(o)}}
function tile(c){let img=c.photo?`<img loading="lazy" decoding="async" width="300" height="420" src="${safe(c.photo)}" alt="${safe(c.name)}" onerror="this.parentElement.innerHTML='<div class=placeholder><span class=symbol>✦</span>Image unavailable</div>'">`:'<div class="placeholder"><span class="symbol">✦</span><span>Card image unavailable</span></div>';return `<article class="card"><div class="photo">${img}</div><div class="details"><div class="name">${safe(c.name)}</div><div class="set">${safe(c.set)}${c.number?' · #'+safe(c.number):' · Unnumbered'}</div><div class="chips">${c.rarity?`<span class="chip gold">${safe(c.rarity)}</span>`:''}${c.variant?`<span class="chip">${safe(c.variant)}</span>`:''}${c.condition?`<span class="chip">${safe(c.condition)}</span>`:''}</div></div></article>`}
function showMore(){let next=filtered.slice(shown,shown+perPage);$('grid').insertAdjacentHTML('beforeend',next.map(tile).join(''));shown+=next.length;$('more').hidden=shown>=filtered.length}
function update(){let q=$('search').value.trim().toLowerCase();filtered=cards.filter(c=>(!q||[c.name,c.set,c.number,c.rarity,c.variant,c.type,c.condition].some(v=>String(v).toLowerCase().includes(q)))&&(!$('set').value||c.set===$('set').value)&&(!$('rarity').value||c.rarity===$('rarity').value)&&(!$('condition').value||c.condition===$('condition').value));shown=0;$('grid').innerHTML='';$('count').textContent=`Showing ${filtered.length.toLocaleString()} of ${cards.length.toLocaleString()} cards`;if(!filtered.length)$('grid').innerHTML='<div class="empty">No matching cards. Try another search.</div>';$('more').hidden=true;showMore()}
async function init(){try{let res=await fetch('./cards.json');if(!res.ok)throw Error('Cannot load cards');cards=await res.json();$('total').textContent=`${cards.length.toLocaleString()} cards in the collection`;['set','rarity','condition'].forEach(k=>fill(k,k));['search','set','rarity','condition'].forEach(k=>$(k).addEventListener(k==='search'?'input':'change',update));$('reset').addEventListener('click',()=>{$('search').value='';['set','rarity','condition'].forEach(k=>$(k).value='');update()});$('more').addEventListener('click',showMore);update()}catch(e){$('count').textContent='Unable to load collection. Publish both index.html and cards.json to a website host.'}}init();
</script></body></html>
